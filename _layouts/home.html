<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Darien dot Ink</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #fff;
        }

        a {
            color: yellow;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            width: 100%;
            height: 400px;
            /* background-color: #3498db; */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 40px;
        }

        header h1 {
            /* color: white; */
            font-size: 200px;
            text-align: center;
        }

        header h2 {
            /* color: white; */
            font-size: 80px;
            text-align: center;
        }

        .projects-section {
            margin-top: 20px;
        }

        .projects-section h2 {
            font-size: 32px;
            margin-bottom: 30px;
            /* color: #333; */
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(1, 1fr);
            gap: 20px;
        }

        .project-card {
            /* background-color: #e74c3c; */
            /* aspect-ratio: 1; */
            background-color: black;
            height: 200px;
            background-position: center;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .project-card:hover {

        }

        .project-card h3 {
            color: white;
            font-size: 36px;
            text-align: center;
            padding: 20px;
        }



        #info-overlay {
            position: fixed;
            top: 0px;
            left: 0px;
            width: 100%;
            height: 100%;
            z-index: 101;
            pointer-events: none;
        }

        .overlay-pane {
            position: absolute;
            background-color: #000;
            transition-duration: 0.4s;
            overflow-y: auto;

            font-size: 150%;
        }

        #right-overlay-pane {
            top: 0px;
            bottom: 0px;
            right: -100%;
            width: 50%;
            border-left: 2px solid silver;
        }

        #left-overlay-pane {
            top: 0px;
            bottom: 0px;
            left: -100%;
            width: 50%;
            border-right: 2px solid silver;
        }

        #bottom-overlay-pane {
            left: 0px;
            right: 0px;
            bottom: -100%;
            height: 80%;
            border-top: 2px solid silver;
        }

        .overlay-pane-content {
            margin: 30px;
        }

        .overlay-pane img {
            max-width: 100%;
        }

    </style>
</head>
<body>
    <div id="info-overlay">
        <div id="overlay-bg" onclick="close_pane();" class="parent-size" style="height:100%; background-color:rgb(29, 29, 29); opacity:0%; transition: opacity 0.4s;"></div>
        <div id="right-overlay-pane" class="overlay-pane">
            <div class="overlay-pane-content"></div>
        </div>
        <div id="left-overlay-pane" class="overlay-pane">
            <div class="overlay-pane-content"></div>
        </div>
        <div id="bottom-overlay-pane" class="overlay-pane">
            <div class="overlay-pane-content" style="margin:15px;"></div>
        </div>
    </div>
    <div class="container">
        <header>
            <h2>welcome to</h2>
            <div style="display:flex; flex-direction:row; align-items: flex-end">
                <h1>Darien</h1>
                <img height="50px" src="assets/images/darienball.gif">
                <h1>Ink</h1>
            </div>
        </header>

        <section class="projects-section">
            <h2>Projects</h2>
            <div class="projects-grid">
                {% for item in site.data.projects %}

                <div onclick="open_pane('{{item.name}}')" class="project-card" style="background-image: url({{item.image}})">
                    <h3>{{item.name}}</h3>
                </div>

                {% endfor %}
            </div>
        </section>
    </div>
    <script>

    var mouse_x = 0;
    addEventListener('mousemove', (event) => { mouse_x = event.clientX; });

    function open_pane(item)
    {
        if (window.innerWidth < window.innerHeight)
        {
            document.getElementById("bottom-overlay-pane").style.bottom = "0%";
            document.getElementById("bottom-overlay-pane").children[0].innerHTML = project_data[item];
        }
        else
        {
            if (mouse_x < window.innerWidth * 0.5)
            {
                document.getElementById("right-overlay-pane").style.right = "0%";
                document.getElementById("right-overlay-pane").children[0].innerHTML = project_data[item];
            }
            else
            {
                document.getElementById("left-overlay-pane").style.left = "0%";
                document.getElementById("left-overlay-pane").children[0].innerHTML = project_data[item];
            }
        }
        document.getElementById("info-overlay").style.pointerEvents = "all";
        document.getElementById("overlay-bg").style.opacity = "50%";
        document.body.style.overflowY = "hidden";
    }

    function close_pane()
    {
        document.getElementById("right-overlay-pane").style.right = "-100%";
        document.getElementById("left-overlay-pane").style.left = "-100%";
        document.getElementById("bottom-overlay-pane").style.bottom = "-100%";

        document.getElementById("info-overlay").style.pointerEvents = "none";
        document.getElementById("overlay-bg").style.opacity = "0%";
        document.body.style.overflowY = "auto";
    }

    var project_data = {};

    {% for item in site.data.projects %}
        project_data["{{item.name}}"] = '{{item.content}}';
    {% endfor %}

    </script>
</body>
</html>
